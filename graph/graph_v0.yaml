# 인지 의존성 그래프 v0 — 초등 수학 '수와 연산' (수 이전 개념 ~ 두 자리 수 덧셈·뺄셈, 곱셈구구)
#
# 설계 원칙
#  1. 노드는 '개념' 단위. 교육과정 성취기준보다 한 단계 아래 (교사가 이미 아는 수준보다 세분화).
#  2. 모든 노드·엣지에 근거(sources) 필수. 근거 없는 엣지는 넣지 않는다.
#  3. 두 교육과정(공통 / 특수교육 기본)을 같은 노드에 함께 태깅한다. 두 교육과정은 같은 개념
#     사다리를 다른 속도로 오르므로, 노드는 하나이고 level_hint 에 두 위치를 모두 적는다.
#  4. 엣지 kind: hard = 이 선수 개념 없이는 후속 개념 학습이 성립하지 않음(원문 해설에 명시적 근거).
#                soft = 권장 선수(궤적·해설에서 도움 관계로 언급되나 필수라고 단정하기 어려움).
#
# 근거 표기
#  - type: curriculum_basic   → 2022 개정 특수교육 기본교육과정 [N수학01-xx]  (sources/2022_특수교육_기본교육과정_수학_수와연산_성취기준.md)
#  - type: curriculum_common  → 2022 개정 공통교육과정 수학 [2수01-xx]/[4수01-xx] (sources/2022_공통교육과정_수학_수와연산_성취기준.md)
#  - type: trajectory         → Clements & Sarama 학습궤적, learningtrajectories.org 현행 레벨명 (레벨명만 원문 확인, 설명은 미확인)
#  검토 상태: 이 파일의 교육과정 인용은 1차 자료 원문 확인(2026-11-06). 궤적 레벨명은 원문 확인, 레벨↔노드 대응은 설계자 판단.
#  독립 검증(2026-11-07): 1차 자료 3종이 NCIC 공식 배포본과 MD5 일치 확인. 2024.8.16·2026.1.21 일부개정은
#  수학과(별책8)·기본교육과정 '수와 연산' 성취기준에 영향 없음(현행 유효). 상세: docs/review/source_verification_2026-11-07.md
#
version: "0.1"
domain: "초등 수학 · 수와 연산 (수 이전 개념 ~ 두 자리 수 덧셈·뺄셈, 곱셈구구)"

nodes:
  # ───────────────────────── A. 수의 기초 (수 이전 개념) ─────────────────────────
  - id: N01_one_to_one_matching
    label: "일대일 짝짓기"
    description: "서로 관계있는 구체물을 하나씩 대응시켜 짝을 만든다."
    level_hint: "기본 초1~2 / 공통: 해당 없음(취학 전)"
    sources:
      - {type: curriculum_basic, ref: "[2수학01-04] 서로 관계있는 구체물을 찾아 일대일로 짝짓는다.", page: "PDF p.148"}
      - {type: trajectory, ref: "Comparing and Ordering Number: Early Comparison Corresponder / Matching Comparer", url: "https://www.learningtrajectories.org/math/learning-trajectories"}

  - id: N02_perceptual_compare
    label: "직관적 많다·적다 비교"
    description: "하나씩 세지 않고 두 무리를 보고 어느 쪽이 많은지 말한다."
    level_hint: "기본 초1~2"
    sources:
      - {type: curriculum_basic, ref: "[2수학01-03] 구체물을 보고 많은 것과 적은 것을 비교한다. (해설: 하나씩 세지 않고 눈으로 보았을 때의 수량을 비교)", page: "PDF p.148"}
      - {type: trajectory, ref: "Comparing and Ordering Number: Perceptual Comparer", url: "https://www.learningtrajectories.org/math/learning-trajectories"}

  - id: N03_ordering_by_attribute
    label: "기준에 따라 순서짓기"
    description: "크기 등 한 가지 기준으로 구체물 세 개 이상을 순서대로 배열한다."
    level_hint: "기본 초1~2"
    sources:
      - {type: curriculum_basic, ref: "[2수학01-05] 구체물을 한 가지 기준에 따라 순서대로 배열한다. (해설: 수의 계열과 수의 대소 비교에 바탕이 되는 개념)", page: "PDF p.148~149"}
      - {type: trajectory, ref: "Comparing and Ordering Number: Serial Orderer to 5", url: "https://www.learningtrajectories.org/math/learning-trajectories"}

  - id: N04_subitize_small
    label: "작은 수량 즉각 인식(1~3)"
    description: "있다/없다, 한 개/여러 개를 구별하고 1~3개를 세지 않고 알아본다."
    level_hint: "기본 초1~2"
    sources:
      - {type: curriculum_basic, ref: "[2수학01-06] 구체물이 있고 없음을 구별하고, 한 개와 여러 개를 구별한다.", page: "PDF p.149"}
      - {type: trajectory, ref: "Subitizing: Very Small Number Recognizer / Small Collection Namer", url: "https://www.learningtrajectories.org/math/learning-trajectories"}

  # ───────────────────────── B. 수 세기 ─────────────────────────
  - id: N05_count_sequence_to_10
    label: "수 단어 순서 암송(10까지)"
    description: "하나·둘·셋… 또는 일·이·삼… 을 열까지 순서대로 말한다."
    level_hint: "기본 초1~2(암묵) / 공통 1~2학년군 [2수01-01] 일부"
    sources:
      - {type: trajectory, ref: "Counting: Reciter (10)", url: "https://www.learningtrajectories.org/math/learning-trajectories/counting"}
      - {type: curriculum_basic, ref: "[2수학01-07] 해설: 하나, 둘, 셋, 넷, 다섯으로 구체물의 개수를 직접 세어 보며 (수 단어 순서를 전제)", page: "PDF p.149"}

  - id: N06_count_objects_to_5
    label: "5까지 개수 세기"
    description: "구체물 5개 이하를 하나씩 대응하며 세고, 마지막 수가 전체 개수임을 안다(기수 원리)."
    level_hint: "기본 초1~2 / 공통 [2수01-01] 일부"
    sources:
      - {type: curriculum_basic, ref: "[2수학01-07] 다섯 개 이하 구체물의 개수를 센다. / [2수학01-08] 배열이 다른 구체물의 개수를 세어 비교한다.", page: "PDF p.149~150"}
      - {type: trajectory, ref: "Counting: Corresponder → Counter (Small Numbers)", url: "https://www.learningtrajectories.org/math/learning-trajectories/counting"}

  - id: N07_count_objects_to_10
    label: "10까지 개수 세기"
    description: "구체물 10개 이하를 세고 전체 개수를 말한다."
    level_hint: "기본 초3~4 / 공통 [2수01-01] 일부"
    sources:
      - {type: curriculum_basic, ref: "[4수학01-01] 열 개 이하의 구체물 개수를 센다. (해설: 마지막 구체물에 대응하는 개수의 이름이 전체의 개수)", page: "PDF p.156~157"}
      - {type: curriculum_common, ref: "[2수01-01] 수의 필요성을 인식하면서 0과 100까지의 수 개념을 이해하고, 수를 세고 읽고 쓸 수 있다.", page: "PDF p.17"}
      - {type: trajectory, ref: "Counting: Counter (10)", url: "https://www.learningtrajectories.org/math/learning-trajectories/counting"}

  - id: N08_produce_set_to_10
    label: "주어진 수만큼 꺼내기(10까지)"
    description: "'N개 주세요'에 맞게 구체물을 세어 N개를 만든다."
    level_hint: "기본 초3~4"
    sources:
      - {type: curriculum_basic, ref: "[4수학01-03~05] 적용 고려사항: 수를 제시하면 제시된 수만큼 구체물의 개수를 세고 모으는 조작 활동", page: "PDF p.157"}
      - {type: trajectory, ref: "Counting: Producer (Small Numbers) → Counter and Producer (10+)", url: "https://www.learningtrajectories.org/math/learning-trajectories/counting"}

  - id: N09_numerals_to_9
    label: "1~9 수 읽고 쓰기"
    description: "구체물 개수와 숫자 1~9를 연결하고, 숫자를 읽고 쓴다."
    level_hint: "기본 초3~4 / 공통 [2수01-01] 일부"
    sources:
      - {type: curriculum_basic, ref: "[4수학01-03] 9 이하의 수를 읽고 쓴다. (해설: 구체물 개수와 1부터 9까지의 수를 연결)", page: "PDF p.156~157"}
      - {type: curriculum_common, ref: "[2수01-01]", page: "PDF p.17"}

  - id: N10_zero
    label: "0의 개념"
    description: "아무것도 없음을 0으로 나타내고 읽고 쓴다."
    level_hint: "기본 초3~4 / 공통 [2수01-01]"
    sources:
      - {type: curriculum_basic, ref: "[4수학01-04] 0의 개념을 알고 0을 읽고 쓴다. (해설: 열 개 이하의 구체물을 하나씩 줄이며 구체물이 없을 때는 0으로 표현)", page: "PDF p.156~157"}
      - {type: curriculum_common, ref: "[2수01-01] 0과 100까지의 수 개념", page: "PDF p.17"}

  - id: N11_compare_numbers_to_10
    label: "10 이하 수 크기 비교"
    description: "두 수(또는 두 무리의 개수)를 비교해 어느 것이 크고 작은지 말한다."
    level_hint: "기본 초3~4 / 공통 [2수01-03] 일부"
    sources:
      - {type: curriculum_basic, ref: "[4수학01-02] 두 모음의 구체물 개수를 비교하고 많고 적음을 표현한다. / [4수학01-05] 9 이하의 수 크기를 비교한다.", page: "PDF p.156"}
      - {type: trajectory, ref: "Comparing and Ordering Number: Counting Comparer (10) / Mental Number Line to 10", url: "https://www.learningtrajectories.org/math/learning-trajectories"}

  - id: N12_ordinal_to_10
    label: "순서수(첫째~열째)"
    description: "한 줄로 배열된 구체물의 순서를 순서수로 말한다."
    level_hint: "기본 초3~4"
    sources:
      - {type: curriculum_basic, ref: "[4수학01-06] 구체물의 배열을 순서수로 표현한다.", page: "PDF p.156~157"}
      - {type: trajectory, ref: "Comparing and Ordering Number: Ordinal Counter", url: "https://www.learningtrajectories.org/math/learning-trajectories"}

  - id: N13_count_on_from_n
    label: "N에서 이어 세기"
    description: "1부터 다시 세지 않고 주어진 수 N 다음부터 센다(N+1, N−1 포함)."
    level_hint: "교육과정 명시 없음(궤적 기반) / 공통 [2수01-01] 고려사항의 세기 전략과 연결"
    sources:
      - {type: trajectory, ref: "Counting: Counter from N (N + 1, N - 1)", url: "https://www.learningtrajectories.org/math/learning-trajectories/counting"}
      - {type: curriculum_common, ref: "[2수01-01] 적용 고려사항: 수 세기가 필요한 장면에서 묶어 세기, 뛰어 세기의 방법으로 수를 세어 보게 한다. (간접 근거)", page: "PDF p.18"}

  # ───────────────────────── C. 수 합성·분해 ─────────────────────────
  - id: N14_compose_decompose_to_5
    label: "5 이하 가르기·모으기"
    description: "구체물 5개 이하를 두 무리로 가르고 다시 하나로 모은다."
    level_hint: "기본 초1~2 / 공통 [2수01-04] 일부"
    sources:
      - {type: curriculum_basic, ref: "[2수학01-09] 다섯 개 이하의 구체물을 양쪽으로 가른다. / [2수학01-10] 양쪽의 구체물을 하나로 모은다.", page: "PDF p.150"}
      - {type: trajectory, ref: "Composing Numbers: Composer to 4, then 5", url: "https://www.learningtrajectories.org/math/learning-trajectories"}

  - id: N15_compose_decompose_to_10
    label: "10 이하 가르기·모으기"
    description: "9 이하의 수를 두 수로 가르고, 두 수를 하나로 모은다(예: 7 = 3과 4)."
    level_hint: "기본 초3~4(적용 고려사항) / 공통 [2수01-04]"
    sources:
      - {type: curriculum_basic, ref: "초3~4 수의 연산 적용 고려사항: 9개 이하인 구체물을 가지고 가르기와 모으기의 조작 활동을 반복하여 연산을 경험", page: "PDF p.158"}
      - {type: curriculum_common, ref: "[2수01-04] 하나의 수를 두 수로 분해하고 두 수를 하나의 수로 합성하는 활동을 통하여 수 감각을 기른다. (고려사항: 20 이하의 수의 범위)", page: "PDF p.17~18"}
      - {type: trajectory, ref: "Composing Numbers: Composer to 7 → Composer to 10", url: "https://www.learningtrajectories.org/math/learning-trajectories"}

  - id: N16_ten_complements
    label: "10의 보수(합이 10이 되는 두 수)"
    description: "10을 두 수로 가르고(1과 9, 2와 8…), 합이 10이 되는 덧셈식을 만든다."
    level_hint: "기본 초5~6 / 공통 [2수01-04]·[2수01-06] 전제"
    sources:
      - {type: curriculum_basic, ref: "[6수학01-04] 합이 10이 되는 더하기를 하고 덧셈식으로 나타낸다. (해설: 10의 보수 관계를 파악하는 데 중점)", page: "PDF p.166"}
      - {type: curriculum_common, ref: "[2수01-08] 적용 고려사항: 합이 10이 되는 두 수를 먼저 더하고", page: "PDF p.18"}
      - {type: trajectory, ref: "Composing Numbers: Composer to 10", url: "https://www.learningtrajectories.org/math/learning-trajectories"}

  - id: N17_teen_as_ten_and_ones
    label: "십몇 = 10과 몇"
    description: "11~19를 10개 묶음 하나와 낱개 몇으로 가르고 모은다."
    level_hint: "공통 [2수01-04] 고려사항(20 이하) / 기본: 명시 없음(초5~6 [6수학01-02]의 전 단계)"
    sources:
      - {type: curriculum_common, ref: "[2수01-04] 적용 고려사항: 수를 분해하고 합성하는 활동은 20 이하의 수의 범위에서 한다.", page: "PDF p.18"}
      - {type: trajectory, ref: "Composing Numbers: Composer to 20", url: "https://www.learningtrajectories.org/math/learning-trajectories"}

  # ───────────────────────── D. 덧셈·뺄셈 ─────────────────────────
  - id: N18_add_sub_meaning
    label: "덧셈·뺄셈의 의미"
    description: "더하면 많아지고 빼면 적어지는 실생활 상황을 덧셈·뺄셈 상황으로 알아본다."
    level_hint: "기본 초3~4 / 공통 [2수01-05]"
    sources:
      - {type: curriculum_basic, ref: "[4수학01-07] 실생활에서 활용되는 한 자리 수의 덧셈과 뺄셈의 의미를 안다. (해설: 덧셈은 개수가 더 많아지는 것, 뺄셈은 개수가 더 적어지는 것)", page: "PDF p.157~158"}
      - {type: curriculum_common, ref: "[2수01-05] 덧셈과 뺄셈이 이루어지는 실생활 상황과 연결하여 덧셈과 뺄셈의 의미를 이해한다.", page: "PDF p.17"}
      - {type: trajectory, ref: "Adding/Subtracting: Find Result +/-", url: "https://www.learningtrajectories.org/math/learning-trajectories"}

  - id: N19_add_within_5
    label: "합 5 이하 덧셈"
    description: "구체물·반구체물로 합이 5 이하인 더하기를 한다."
    level_hint: "기본 초3~4(단계적 지도의 1단계)"
    sources:
      - {type: curriculum_basic, ref: "[4수학01-08] 해설: 우선 합이 5 이하가 되는 덧셈부터 시작하여 합이 9 이하인 덧셈까지 단계적인 내용을 다룬다.", page: "PDF p.158"}
      - {type: trajectory, ref: "Adding/Subtracting: Small Number +/-", url: "https://www.learningtrajectories.org/math/learning-trajectories"}

  - id: N20_sub_within_5
    label: "피감수 5 이하 뺄셈"
    description: "구체물·반구체물로 5 이하에서 덜어내는 빼기를 한다."
    level_hint: "기본 초3~4(단계적 지도의 1단계)"
    sources:
      - {type: curriculum_basic, ref: "[4수학01-09] 해설: 피감수가 5 이하인 뺄셈을 충분히 학습한 뒤 피감수가 9 이하인 뺄셈을 경험", page: "PDF p.158"}
      - {type: trajectory, ref: "Adding/Subtracting: Small Number +/-", url: "https://www.learningtrajectories.org/math/learning-trajectories"}

  - id: N21_add_within_9_equation
    label: "합 9 이하 덧셈과 덧셈식"
    description: "합이 9 이하인 더하기를 하고 '3+4=7' 형태의 덧셈식으로 나타낸다."
    level_hint: "기본 초3~4 / 공통 [2수01-06] 일부"
    sources:
      - {type: curriculum_basic, ref: "[4수학01-08] 합이 9 이하인 더하기를 하고 덧셈식으로 나타낸다.", page: "PDF p.157"}
      - {type: curriculum_common, ref: "[2수01-06] 두 자리 수의 범위에서 덧셈과 뺄셈의 계산 원리를 이해하고 그 계산을 할 수 있다.", page: "PDF p.17"}
      - {type: trajectory, ref: "Adding/Subtracting: Counting Strategies +/-", url: "https://www.learningtrajectories.org/math/learning-trajectories"}

  - id: N22_sub_within_9_equation
    label: "피감수 9 이하 뺄셈과 뺄셈식"
    description: "피감수가 9 이하인 빼기를 하고 '7−3=4' 형태의 뺄셈식으로 나타낸다."
    level_hint: "기본 초3~4 / 공통 [2수01-06] 일부"
    sources:
      - {type: curriculum_basic, ref: "[4수학01-09] 피감수가 9 이하인 빼기를 하고 뺄셈식으로 나타낸다.", page: "PDF p.157"}
      - {type: curriculum_common, ref: "[2수01-06]", page: "PDF p.17"}
      - {type: trajectory, ref: "Adding/Subtracting: Counting Strategies +/-", url: "https://www.learningtrajectories.org/math/learning-trajectories"}

  - id: N23_add_sub_with_zero
    label: "0이 있는 덧셈·뺄셈"
    description: "어떤 수에 0을 더하거나 빼도 변하지 않음을 안다."
    level_hint: "기본 초3~4 / 공통 [2수01-06]"
    sources:
      - {type: curriculum_basic, ref: "[4수학01-10] 0이 있는 덧셈과 뺄셈을 한다.", page: "PDF p.157"}

  - id: N24_add_sub_relation
    label: "덧셈과 뺄셈의 관계"
    description: "한 상황을 덧셈식과 뺄셈식으로 모두 나타내고(3+4=7 ↔ 7−4=3) 부분·전체 관계를 안다."
    level_hint: "공통 [2수01-07] / 기본: 명시 없음"
    sources:
      - {type: curriculum_common, ref: "[2수01-07] 덧셈과 뺄셈의 관계를 이해한다. (고려사항: 한 가지 상황을 간단한 덧셈식과 뺄셈식으로 나타내는 활동)", page: "PDF p.17~18"}
      - {type: trajectory, ref: "Adding/Subtracting: Part-Whole +/-", url: "https://www.learningtrajectories.org/math/learning-trajectories"}

  - id: N25_sub_from_10
    label: "10에서 빼기"
    description: "피감수가 10인 뺄셈을 10의 보수로 해결하고 뺄셈식으로 나타낸다."
    level_hint: "기본 초5~6"
    sources:
      - {type: curriculum_basic, ref: "[6수학01-05] 피감수가 10인 빼기를 하고 뺄셈식으로 나타낸다. (해설: 10의 보수 개념을 활용하여)", page: "PDF p.166"}

  - id: N26_add_single_digit_carry
    label: "받아올림 있는 (몇)+(몇)"
    description: "합이 10을 넘는 한 자리 수 덧셈(8+5)을 10 만들기 전략으로 해결한다."
    level_hint: "기본 중1~3 / 공통 [2수01-06]"
    sources:
      - {type: curriculum_basic, ref: "[9수학01-07] 받아올림이 있는 한 자리 수의 덧셈을 한다. (해설: 10의 보수 개념을 바탕으로 10개의 칸이 그려진 그림 등을 활용)", page: "PDF p.176"}
      - {type: curriculum_common, ref: "[2수01-06]", page: "PDF p.17"}
      - {type: trajectory, ref: "Adding/Subtracting: Deriver +/- (derived combinations)", url: "https://www.learningtrajectories.org/math/learning-trajectories"}

  - id: N27_sub_teen_borrow
    label: "받아내림 있는 (십몇)−(몇)"
    description: "13−5 같은 뺄셈을 10의 보수(10에서 빼고 남은 것 더하기)로 해결한다."
    level_hint: "기본 고1~3 / 공통 [2수01-06]"
    sources:
      - {type: curriculum_basic, ref: "[12수학01-10] 받아내림이 있는 (십몇)-(몇)을 한다. (해설: 10의 보수 개념을 활용하여 10개 칸이 그려진 그림 등을 활용)", page: "PDF p.187"}
      - {type: curriculum_common, ref: "[2수01-06]", page: "PDF p.17"}
      - {type: trajectory, ref: "Adding/Subtracting: Deriver +/-", url: "https://www.learningtrajectories.org/math/learning-trajectories"}

  # ───────────────────────── E. 자릿값·두 자리 수 ─────────────────────────
  - id: N28_ten_as_unit
    label: "10의 개념과 몇십 세기"
    description: "9보다 1 큰 수가 10임을 알고, 10씩 묶어 10, 20, 30…을 센다."
    level_hint: "기본 초5~6 / 공통 [2수01-01]·[2수01-02]"
    sources:
      - {type: curriculum_basic, ref: "[6수학01-01] 10의 개념을 알고, 몇십을 센다. (해설: 구체물을 세어서 10이 되게 만드는 활동을 반복 … 10씩 묶으며 몇십으로 세는 활동)", page: "PDF p.165"}
      - {type: trajectory, ref: "Counting: Skip Counter by 10s to 100 / Counter of Quantitative Units/Place Value", url: "https://www.learningtrajectories.org/math/learning-trajectories/counting"}

  - id: N29_two_digit_place_value
    label: "두 자리 수 자릿값(10묶음과 낱개)"
    description: "10개 묶음 몇 개와 낱개 몇 개를 두 자리 수로 읽고 쓴다(3묶음 4낱개 = 34)."
    level_hint: "기본 초5~6 / 공통 [2수01-02]"
    sources:
      - {type: curriculum_basic, ref: "[6수학01-02] 10개의 묶음과 낱개의 수를 두 자리 수로 나타낸다. (해설: 십 모형의 수와 낱개의 수를 두 자리 수로 나타내고 자릿값 개념을 형성)", page: "PDF p.165"}
      - {type: curriculum_common, ref: "[2수01-02] 일, 십, 백, 천의 자릿값과 위치적 기수법을 이해하고 … (고려사항: 두 자리 수를 10개씩 묶음과 낱개로 나타내게 함으로써 위치적 기수법의 기초 개념을 형성)", page: "PDF p.17~18"}
      - {type: trajectory, ref: "Composing Numbers: Composer with Tens and Ones", url: "https://www.learningtrajectories.org/math/learning-trajectories"}

  - id: N30_count_to_100_sequence
    label: "100까지 수 세기와 수 계열"
    description: "100까지 순서대로 세고, 수의 순서(앞뒤 수)를 안다."
    level_hint: "공통 [2수01-01]·[2수01-03] / 기본: 명시 없음(초5~6 두 자리 수의 연장)"
    sources:
      - {type: curriculum_common, ref: "[2수01-01] 0과 100까지의 수 개념 … / [2수01-03] 네 자리 이하의 수의 범위에서 수의 계열을 이해하고", page: "PDF p.17"}
      - {type: trajectory, ref: "Counting: Counter to 100", url: "https://www.learningtrajectories.org/math/learning-trajectories/counting"}

  - id: N31_compare_two_digit
    label: "두 자리 수 크기 비교"
    description: "십의 자리부터 비교하여 두 자리 수의 크기를 비교한다."
    level_hint: "기본 초5~6 / 공통 [2수01-03]"
    sources:
      - {type: curriculum_basic, ref: "[6수학01-03] 두 자리 수의 크기를 비교한다. (해설: 자릿값 개념을 형성하여 두 자리 수의 크기를 비교)", page: "PDF p.165"}
      - {type: curriculum_common, ref: "[2수01-03] … 수의 크기를 비교할 수 있다.", page: "PDF p.17"}
      - {type: trajectory, ref: "Comparing and Ordering Number: Place Value Comparer", url: "https://www.learningtrajectories.org/math/learning-trajectories"}

  - id: N32_add_sub_tens
    label: "몇십 ± 몇십(받아올림·내림 없음)"
    description: "20+30, 50−20처럼 십의 자리끼리의 덧셈·뺄셈을 한다."
    level_hint: "기본 초5~6 / 공통 [2수01-06]"
    sources:
      - {type: curriculum_basic, ref: "[6수학01-07] 받아올림(내림)이 없는 몇십의 덧셈과 뺄셈을 한다. (해설: 세로식은 자릿값을 맞추어 계산)", page: "PDF p.166"}
      - {type: curriculum_common, ref: "[2수01-06]", page: "PDF p.17"}

  - id: N33_add_sub_two_digit_no_regroup
    label: "두 자리 수 ± (받아올림·내림 없음)"
    description: "23+14, 47−25처럼 자리별로 더하고 빼는 두 자리 수 덧셈·뺄셈."
    level_hint: "공통 [2수01-06] / 기본: 명시 없음(몇십 연산과 세 자리 수 사이)"
    sources:
      - {type: curriculum_common, ref: "[2수01-06] 두 자리 수의 범위에서 덧셈과 뺄셈의 계산 원리를 이해하고 그 계산을 할 수 있다.", page: "PDF p.17"}
      - {type: trajectory, ref: "Adding/Subtracting: Multidigit +/-", url: "https://www.learningtrajectories.org/math/learning-trajectories"}

  - id: N34_add_sub_two_digit_regroup
    label: "두 자리 수 ± (받아올림·내림 있음)"
    description: "38+27, 52−19처럼 받아올림·받아내림이 있는 두 자리 수 덧셈·뺄셈(합이 세 자리인 경우 포함)."
    level_hint: "공통 [2수01-06] / 기본: 명시 없음"
    sources:
      - {type: curriculum_common, ref: "[2수01-06] (해설: 덧셈은 두 자리 수의 범위에서 다루되, 합이 세 자리 수인 경우도 포함한다.)", page: "PDF p.17"}
      - {type: trajectory, ref: "Adding/Subtracting: Multidigit +/-", url: "https://www.learningtrajectories.org/math/learning-trajectories"}

  - id: N35_three_addends
    label: "세 수의 덧셈과 뺄셈"
    description: "두 자리 수 범위에서 세 수를 차례로 더하거나 빼고, 10이 되는 두 수를 먼저 더할 수 있다."
    level_hint: "공통 [2수01-08]"
    sources:
      - {type: curriculum_common, ref: "[2수01-08] 두 자리 수의 범위에서 세 수의 덧셈과 뺄셈을 할 수 있다. (고려사항: 합이 10이 되는 두 수를 먼저 더하고 나머지 수를 더한 결과를 비교)", page: "PDF p.17~18"}

  - id: N36_missing_number_equation
    label: "□가 있는 덧셈식·뺄셈식"
    description: "3+□=7 같은 식을 만들고 □의 값을 구한다."
    level_hint: "공통 [2수01-09]"
    sources:
      - {type: curriculum_common, ref: "[2수01-09] □가 사용된 덧셈식과 뺄셈식을 만들고, □의 값을 구할 수 있다. (고려사항: □의 값을 직관적으로 구할 수 있는 수준)", page: "PDF p.17~18"}
      - {type: trajectory, ref: "Adding/Subtracting: Find Change +/-", url: "https://www.learningtrajectories.org/math/learning-trajectories"}

  # ───────────────────────── F. 곱셈 ─────────────────────────
  - id: N37_skip_counting
    label: "묶어 세기·뛰어 세기"
    description: "2씩, 5씩, 10씩 묶어서 또는 뛰어서 센다."
    level_hint: "공통 [2수01-01] 고려사항 / 기본: 명시 없음"
    sources:
      - {type: curriculum_common, ref: "[2수01-01] 적용 고려사항: 수 세기가 필요한 장면에서 묶어 세기, 뛰어 세기의 방법으로 수를 세어 보게 한다.", page: "PDF p.18"}
      - {type: trajectory, ref: "Counting: Skip Counter", url: "https://www.learningtrajectories.org/math/learning-trajectories/counting"}

  - id: N38_mult_meaning
    label: "곱셈의 의미(배, 동수누가)"
    description: "'3씩 4묶음'을 3+3+3+3 또는 3의 4배로 보고 곱셈 상황을 알아본다."
    level_hint: "기본 중1~3 / 공통 [2수01-10]"
    sources:
      - {type: curriculum_common, ref: "[2수01-10] 곱셈이 이루어지는 실생활 상황과 연결하여 곱셈의 의미를 이해한다. (고려사항: 곱셈의 의미는 배의 개념과 동수누가를 통하여 다루고)", page: "PDF p.17~18"}
      - {type: curriculum_basic, ref: "[9수학01-08] 실생활에서 활용되는 곱셈의 의미를 안다. (해설: 곱셈의 의미는 배의 개념과 동수누가를 통해 다룬다)", page: "PDF p.176"}

  - id: N39_mult_table
    label: "곱셈구구"
    description: "1단~9단 곱셈구구를 이해하고 한 자리 수의 곱셈을 한다."
    level_hint: "기본 중1~3 / 공통 [2수01-11]"
    sources:
      - {type: curriculum_common, ref: "[2수01-11] 곱셈구구를 이해하고, 한 자리 수의 곱셈을 할 수 있다.", page: "PDF p.17"}
      - {type: curriculum_basic, ref: "[9수학01-09] 곱셈구구의 원리를 알고 1단부터 9단까지 나타낸다.", page: "PDF p.176"}

edges:
  # ── A → B
  - {from: N01_one_to_one_matching, to: N06_count_objects_to_5, kind: hard,
     sources: [{type: curriculum_basic, ref: "[2수학01-04] 해설: 짝짓기는 … 수 개념과 비교 개념을 형성하기 위한 기초가 되는 활동", page: "PDF p.148"},
               {type: trajectory, ref: "Counting: Corresponder(일대일 대응)가 Counter (Small Numbers)의 선행 레벨"}]}
  - {from: N02_perceptual_compare, to: N11_compare_numbers_to_10, kind: soft,
     sources: [{type: curriculum_basic, ref: "[2수학01-03] 해설: 이 활동은 수의 기초 단계에 해당", page: "PDF p.148"},
               {type: trajectory, ref: "Comparing: Perceptual Comparer → Counting Comparer"}]}
  - {from: N03_ordering_by_attribute, to: N11_compare_numbers_to_10, kind: soft,
     sources: [{type: curriculum_basic, ref: "[2수학01-05] 해설: 수의 계열과 수의 대소 비교에 바탕이 되는 개념을 형성하는 활동", page: "PDF p.149"}]}
  - {from: N04_subitize_small, to: N06_count_objects_to_5, kind: soft,
     sources: [{type: curriculum_basic, ref: "[2수학01-06]이 [2수학01-07] 개수 세기에 선행 배치됨(초1~2 '수' 내용 요소 순서)", page: "PDF p.149"},
               {type: trajectory, ref: "Subitizing 궤적이 Counting 초기 레벨을 지원"}]}
  - {from: N05_count_sequence_to_10, to: N06_count_objects_to_5, kind: hard,
     sources: [{type: trajectory, ref: "Counting: Reciter → Corresponder → Counter (Small Numbers) 순서"}]}

  # ── B 내부
  - {from: N06_count_objects_to_5, to: N07_count_objects_to_10, kind: hard,
     sources: [{type: curriculum_basic, ref: "초3~4 '수' 서두: 열 개 이하의 개수 세기 (초1~2 다섯까지 세기의 확장)", page: "PDF p.156"},
               {type: trajectory, ref: "Counting: Counter (Small Numbers) → Counter (10)"}]}
  - {from: N07_count_objects_to_10, to: N08_produce_set_to_10, kind: hard,
     sources: [{type: trajectory, ref: "Counting: Counter (10) → Producer / Counter and Producer (10+)"}]}
  - {from: N07_count_objects_to_10, to: N09_numerals_to_9, kind: hard,
     sources: [{type: curriculum_basic, ref: "[4수학01-03~05] 해설: 하나부터 열까지의 구체물 개수와 1부터 9까지의 수를 연결하여 구체물 개수에 대응하는 수가 있음을 알게 한다", page: "PDF p.157"}]}
  - {from: N09_numerals_to_9, to: N10_zero, kind: hard,
     sources: [{type: curriculum_basic, ref: "[4수학01-04] 해설: 열 개 이하의 구체물을 하나씩 줄이며 구체물이 없을 때는 0으로 표현함을 알고", page: "PDF p.157"}]}
  - {from: N07_count_objects_to_10, to: N11_compare_numbers_to_10, kind: hard,
     sources: [{type: curriculum_basic, ref: "[4수학01-02] 해설: 열 개 이하인 두 집합을 보고 개수를 비교", page: "PDF p.157"},
               {type: trajectory, ref: "Comparing: Counting Comparer (10)은 세기를 전제"}]}
  - {from: N09_numerals_to_9, to: N11_compare_numbers_to_10, kind: hard,
     sources: [{type: curriculum_basic, ref: "[4수학01-05] 9 이하의 수 크기를 비교한다 (해설: 구체물의 개수와 수의 대응을 통해 수의 크기를 비교)", page: "PDF p.157"}]}
  - {from: N07_count_objects_to_10, to: N12_ordinal_to_10, kind: hard,
     sources: [{type: curriculum_basic, ref: "[4수학01-06]이 같은 학년군 '수'에서 개수 세기 뒤에 배치", page: "PDF p.156"},
               {type: trajectory, ref: "Comparing: Ordinal Counter"}]}
  - {from: N07_count_objects_to_10, to: N13_count_on_from_n, kind: hard,
     sources: [{type: trajectory, ref: "Counting: Counter (10) → Counter from N (N + 1, N - 1)"}]}

  # ── B → C
  - {from: N06_count_objects_to_5, to: N14_compose_decompose_to_5, kind: hard,
     sources: [{type: curriculum_basic, ref: "초1~2 '수의 연산' 서두: '수'에서 학습한 하나에서 다섯까지의 개수 세기를 바탕으로 구체물 가르기와 모으기", page: "PDF p.150"}]}
  - {from: N14_compose_decompose_to_5, to: N15_compose_decompose_to_10, kind: hard,
     sources: [{type: trajectory, ref: "Composing Numbers: Composer to 4, then 5 → Composer to 7 → Composer to 10"}]}
  - {from: N07_count_objects_to_10, to: N15_compose_decompose_to_10, kind: hard,
     sources: [{type: curriculum_basic, ref: "초3~4 적용 고려사항: 9개 이하인 구체물을 가지고 가르기와 모으기 (열까지 세기와 같은 학년군)", page: "PDF p.158"}]}
  - {from: N15_compose_decompose_to_10, to: N16_ten_complements, kind: hard,
     sources: [{type: curriculum_basic, ref: "[6수학01-04] 해설: 10의 보수 관계를 … 구체물을 가르고 모으는 활동과 덧셈식으로 반복 학습", page: "PDF p.166"}]}
  - {from: N28_ten_as_unit, to: N16_ten_complements, kind: soft,
     sources: [{type: curriculum_basic, ref: "초5~6에서 [6수학01-01] 10의 개념이 [6수학01-04] 합이 10이 되는 더하기보다 앞에 배치", page: "PDF p.165~166"}]}
  - {from: N16_ten_complements, to: N17_teen_as_ten_and_ones, kind: hard,
     sources: [{type: trajectory, ref: "Composing Numbers: Composer to 10 → Composer to 20"},
               {type: curriculum_common, ref: "[2수01-04] 고려사항: 분해·합성은 20 이하 범위 (10 이하 → 20 이하 확장)", page: "PDF p.18"}]}
  - {from: N28_ten_as_unit, to: N17_teen_as_ten_and_ones, kind: hard,
     sources: [{type: curriculum_basic, ref: "[6수학01-02] 해설: 십 모형의 수와 낱개의 수 (십몇은 10 묶음 1개와 낱개)", page: "PDF p.165"}]}

  # ── C/B → D
  - {from: N07_count_objects_to_10, to: N18_add_sub_meaning, kind: hard,
     sources: [{type: curriculum_basic, ref: "초3~4 '수의 연산' 서두: 10 이하의 수를 바탕으로 덧셈과 뺄셈의 의미를 이해", page: "PDF p.157"},
               {type: trajectory, ref: "Adding/Subtracting: Find Result +/- 는 세기 전략을 사용"}]}
  - {from: N18_add_sub_meaning, to: N19_add_within_5, kind: hard,
     sources: [{type: curriculum_basic, ref: "[4수학01-07](의미) → [4수학01-08](계산) 배치 순서", page: "PDF p.157"}]}
